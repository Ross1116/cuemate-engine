name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto:
    name: proto
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod

      - name: Install Go proto plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.5
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Buf lint
        run: buf lint

      - name: Protoc compile check
        run: |
          mkdir -p /tmp/cuemate
          protoc \
            --proto_path=proto \
            --descriptor_set_out=/tmp/cuemate/scoring.pb \
            proto/djengine/scoring/v1/scoring.proto
          protoc \
            --proto_path=proto \
            --go_out=go \
            --go_opt=module=github.com/Ross1116/cuemate-engine/go \
            --go-grpc_out=go \
            --go-grpc_opt=module=github.com/Ross1116/cuemate-engine/go \
            proto/djengine/scoring/v1/scoring.proto

  go:
    name: go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Go proto plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.5
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate Go protobuf stubs
        working-directory: .
        run: |
          protoc \
            --proto_path=proto \
            --go_out=go \
            --go_opt=module=github.com/Ross1116/cuemate-engine/go \
            --go-grpc_out=go \
            --go-grpc_opt=module=github.com/Ross1116/cuemate-engine/go \
            proto/djengine/scoring/v1/scoring.proto

      - name: Go test
        shell: bash
        run: |
          if find . -type f -name '*.go' -not -path './gen/*' | grep -q .; then
            go test ./...
          else
            echo "No Go source files yet; skipping go test."
          fi

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Python scaffold checks
        shell: bash
        run: |
          python -m compileall python/src python/tests
          if find python -type f -name '*.py' | grep -q .; then
            python -m pip install --upgrade pip
            python -m pip install ruff
            ruff check python/src python/tests
          else
            echo "No Python source files yet; skipping Ruff."
          fi

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20.19'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
