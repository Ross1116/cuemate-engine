name: cuemate-engine

services:
  migrate:
    image: ghcr.io/amacneil/dbmate:2.32.0
    profiles:
      - ops
    working_dir: /workspace
    env_file:
      - .env
    volumes:
      - ./:/workspace
    command:
      - --migrations-dir
      - db/migrations
      - --schema-file
      - db/schema.sql
      - up
