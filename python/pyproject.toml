[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuemate-analysis"
version = "0.1.0"
description = "CueMate analysis-plane scaffolding."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "protobuf>=6",
  "grpcio>=1.70",
]

[project.optional-dependencies]
analysis = [
  "mutagen",
  "librosa",
  "numpy",
  "scipy",
  "pyloudnorm",
  "soundfile",
]
dev = [
  "grpcio-tools",
  "pytest",
  "ruff",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
