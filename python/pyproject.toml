[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuemate-analysis"
version = "0.1.0"
description = "CueMate analysis-plane ingest and absolute-analysis tools."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "protobuf>=6",
  "grpcio>=1.70",
  "mutagen>=1.47",
  "librosa>=0.10.2",
  "numpy>=1.26",
  "scipy>=1.13",
  "pyloudnorm>=0.1.1",
  "soundfile>=0.12.1",
]

[project.scripts]
cuemate-analysis = "cuemate_analysis.cli:main"

[project.optional-dependencies]
dev = [
  "grpcio-tools",
  "pytest",
  "ruff",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
